services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ter-app
    ports:
      - "8000:8000"
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: 192.168.1.8   # <--- IP Wi-Fi Komputer Anda
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD:          # Kosongkan jika root Laragon tidak memakai password
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
